services:

  consumer:
    build:
      context: ./consumer
      dockerfile: Dockerfile

    container_name: csharp-consumer

    environment:
      Broker__BootstrapServers: broker:19092
      Broker__Topic: messages
      Broker__GroupId: field-intelligence-consumer

      Elasticsearch__Url: http://elasticsearch:9200
      Elasticsearch__IndexName: field-reports

    depends_on:
      broker:
        condition: service_healthy

      elasticsearch:
        condition: service_healthy


  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: broker
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'


    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    
    container_name: python-producer

    environment:
      DATA_FILE_PATH: /app/data/field_reports.json
      KAFKA_BOOTSTRAP_SERVERS: broker:19092
      KAFKA_TOPIC: messages

    depends_on:
      broker:
        condition: service_healthy

    volumes:
      - ./data:/app/data:ro



  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.4
    container_name: elasticsearch
    ports:
      - "9200:9200"

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow > /dev/null"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s


  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.4
    container_name: kibana

    ports:
      - "5601:5601"

    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'

    depends_on:
      elasticsearch:
        condition: service_healthy


      
